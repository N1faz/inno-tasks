---
- hosts: local
  vars:
    nginx_port: 80
    nginx_service: nginx
  tasks: 
    
    - name: "Install Nginx"
      homebrew:
        name: "{{ nginx_service }}"
        state: present

    - name: "Copy nginx.conf.j2"
      template:
        src: nginx.conf.j2
        dest: /usr/local/etc/nginx/nginx.conf
      notify: Restart nginx

    - name: "Start Nginx"
      command:
        cmd: brew services start "{{ nginx_service }}"
 
    - name: "Check Nginx status"
      command:
        cmd: brew services list
      register: result
      changed_when: false

    - name: "Show Nginx status"
      debug:
        msg: "{{ result.stdout }}"

  handlers: 
    - name: Restart nginx
      command:
        cmd: brew services restart "{{ nginx_service }}"
